{% extends "base.html" %}

{% block title %}Edit User - Star Vehicle PRO{% endblock %}

{% block extra_css %}
<style>
    .form-page {
        min-height: calc(100vh - 70px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
        background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
    }

    .form-card {
        background: var(--white);
        border-radius: 24px;
        padding: 3rem 2.5rem;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 25px 80px rgba(0,0,0,0.1);
    }

    .form-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }

    .form-header .icon {
        width: 70px; height: 70px;
        background: linear-gradient(135deg, #dc3545, #c82333);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 1.8rem;
        color: var(--white);
    }

    .form-header h2 {
        font-size: 1.8rem;
        color: var(--dark);
        margin-bottom: 0.5rem;
    }

    .form-header p { color: var(--gray); font-size: 0.95rem; }

    .form-group { margin-bottom: 1.5rem; }

    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: var(--dark);
        font-size: 0.9rem;
    }

    .form-group label i { color: #dc3545; margin-right: 6px; }

    .form-control, .form-select {
        width: 100%;
        padding: 14px 18px;
        border: 2px solid #e9ecef;
        border-radius: 14px;
        font-size: 1rem;
        font-family: 'Poppins', sans-serif;
        transition: all 0.3s;
        background: #fafbfc;
    }

    .form-control:focus, .form-select:focus {
        outline: none;
        border-color: #dc3545;
        background: var(--white);
        box-shadow: 0 0 0 4px rgba(220,53,69,0.1);
    }

    .btn-submit {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #dc3545, #c82333);
        color: var(--white);
        border: none;
        border-radius: 14px;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        font-family: 'Poppins', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(220,53,69,0.4);
    }

    .btn-cancel {
        display: block;
        text-align: center;
        margin-top: 1rem;
        color: var(--gray);
        text-decoration: none;
        font-size: 0.9rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <div class="form-header">
            <div class="icon"><i class="fas fa-user-cog"></i></div>
            <h2>Edit User</h2>
            <p>Update user information and role</p>
        </div>

        <form method="POST" action="{{ url_for('admin_edit_user', user_id=user.id) }}">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Full Name</label>
                <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-phone"></i> Phone Number</label>
                <input type="tel" name="phone" class="form-control" value="{{ user.phone }}" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-shield-alt"></i> User Role</label>
                <select name="role" class="form-select" required>
                    <option value="user" {% if user.role == 'user' %}selected{% endif %}>User</option>
                    <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                </select>
            </div>

            <button type="submit" class="btn-submit"><i class="fas fa-save"></i> Update User</button>
            <a href="{{ url_for('admin_dashboard') }}" class="btn-cancel"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </form>
    </div>
</div>
{% endblock %}
