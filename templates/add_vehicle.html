{% extends "base.html" %}

{% block title %}Add Vehicle - Star Vehicle PRO{% endblock %}

{% block extra_css %}
<style>
    .form-page {
        min-height: calc(100vh - 70px);
        padding: 3rem 1.5rem;
        background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
    }

    .form-card {
        background: var(--white);
        border-radius: 24px;
        padding: 3rem 2.5rem;
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
        box-shadow: 0 25px 80px rgba(0,0,0,0.1);
    }

    .form-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }

    .form-header .icon {
        width: 70px; height: 70px;
        background: linear-gradient(135deg, var(--accent), #e65100);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 1.8rem;
        color: var(--white);
    }

    .form-header h2 {
        font-size: 1.8rem;
        color: var(--dark);
        margin-bottom: 0.5rem;
    }

    .form-header p { color: var(--gray); font-size: 0.95rem; }

    .form-group { margin-bottom: 1.3rem; }

    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: var(--dark);
        font-size: 0.9rem;
    }

    .form-group label i { color: var(--accent); margin-right: 6px; }

    .form-control, .form-select, textarea.form-control {
        width: 100%;
        padding: 14px 18px;
        border: 2px solid #e9ecef;
        border-radius: 14px;
        font-size: 1rem;
        font-family: 'Poppins', sans-serif;
        transition: all 0.3s;
        background: #fafbfc;
    }

    .form-control:focus, .form-select:focus, textarea.form-control:focus {
        outline: none;
        border-color: var(--accent);
        background: var(--white);
        box-shadow: 0 0 0 4px rgba(255,109,0,0.1);
    }

    textarea.form-control {
        resize: vertical;
        min-height: 100px;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }

    .btn-submit {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, var(--accent), #e65100);
        color: var(--white);
        border: none;
        border-radius: 14px;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        font-family: 'Poppins', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 0.5rem;
    }

    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(255,109,0,0.4);
    }

    .btn-cancel {
        display: block;
        text-align: center;
        margin-top: 1rem;
        color: var(--gray);
        text-decoration: none;
        font-size: 0.9rem;
    }

    @media (max-width: 600px) {
        .form-row { grid-template-columns: 1fr; }
    }
</style>
{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <div class="form-header">
            <div class="icon"><i class="fas fa-plus-circle"></i></div>
            <h2>List Your Vehicle</h2>
            <p>Fill in the details to list your vehicle for sale</p>
        </div>

        <form method="POST" action="{{ url_for('add_vehicle') }}">
            <div class="form-group">
                <label><i class="fas fa-heading"></i> Listing Title</label>
                <input type="text" name="title" class="form-control" placeholder="e.g. Clean Toyota Camry 2020" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-car"></i> Brand</label>
                    <input type="text" name="brand" class="form-control" placeholder="e.g. Toyota" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Model</label>
                    <input type="text" name="model" class="form-control" placeholder="e.g. Camry" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-calendar"></i> Year</label>
                    <input type="number" name="year" class="form-control" placeholder="e.g. 2020" min="1900" max="2030" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-dollar-sign"></i> Price (USD)</label>
                    <input type="number" name="price" class="form-control" placeholder="e.g. 25000" min="1" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-tachometer-alt"></i> Mileage (km)</label>
                    <input type="number" name="mileage" class="form-control" placeholder="e.g. 50000" min="0">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-map-marker-alt"></i> Location</label>
                    <input type="text" name="location" class="form-control" placeholder="e.g. New York, NY" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-wrench"></i> Condition</label>
                    <select name="condition" class="form-select" required>
                        <option value="New">New</option>
                        <option value="Used">Used</option>
                        <option value="Certified Pre-Owned">Certified Pre-Owned</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-gas-pump"></i> Fuel Type</label>
                    <select name="fuel_type" class="form-select" required>
                        <option value="Petrol">Petrol</option>
                        <option value="Diesel">Diesel</option>
                        <option value="Electric">Electric</option>
                        <option value="Hybrid">Hybrid</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-cogs"></i> Transmission</label>
                <select name="transmission" class="form-select" required>
                    <option value="Automatic">Automatic</option>
                    <option value="Manual">Manual</option>
                    <option value="CVT">CVT</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-align-left"></i> Description</label>
                <textarea name="description" class="form-control" placeholder="Describe your vehicle, its features, condition, etc." required></textarea>
            </div>

            <button type="submit" class="btn-submit"><i class="fas fa-rocket"></i> List Vehicle</button>
            <a href="{{ url_for('user_dashboard') }}" class="btn-cancel"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </form>
    </div>
</div>
{% endblock %}
