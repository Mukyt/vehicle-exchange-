{% extends "base.html" %}

{% block title %}Login - Star Vehicle PRO{% endblock %}

{% block extra_css %}
<style>
    .auth-page {
        min-height: calc(100vh - 70px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
        background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
    }

    .auth-card {
        background: var(--white);
        border-radius: 24px;
        padding: 3rem 2.5rem;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 25px 80px rgba(0,0,0,0.1);
        border: 1px solid rgba(0,0,0,0.04);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }

    .auth-header .icon {
        width: 70px; height: 70px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 1.8rem;
        color: var(--white);
    }

    .auth-header h2 {
        font-size: 1.8rem;
        color: var(--dark);
        margin-bottom: 0.5rem;
    }

    .auth-header p { color: var(--gray); font-size: 0.95rem; }

    .form-group { margin-bottom: 1.5rem; }

    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: var(--dark);
        font-size: 0.9rem;
    }

    .form-group label i { color: var(--primary); margin-right: 6px; }

    .form-control {
        width: 100%;
        padding: 14px 18px;
        border: 2px solid #e9ecef;
        border-radius: 14px;
        font-size: 1rem;
        font-family: 'Poppins', sans-serif;
        transition: all 0.3s;
        background: #fafbfc;
    }

    .form-control:focus {
        outline: none;
        border-color: var(--primary);
        background: var(--white);
        box-shadow: 0 0 0 4px rgba(26,115,232,0.1);
    }

    .btn-submit {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: var(--white);
        border: none;
        border-radius: 14px;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        font-family: 'Poppins', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(26,115,232,0.4);
    }

    .auth-footer {
        text-align: center;
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid #e9ecef;
    }

    .auth-footer p { color: var(--gray); font-size: 0.9rem; }

    .auth-footer a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
    }

    .auth-footer a:hover { text-decoration: underline; }

    .admin-hint {
        background: #fff3cd;
        border: 1px solid #ffeaa7;
        border-radius: 12px;
        padding: 1rem;
        margin-top: 1.5rem;
        font-size: 0.85rem;
        color: #856404;
    }

    .admin-hint i { margin-right: 6px; }

    .admin-hint code {
        background: rgba(0,0,0,0.05);
        padding: 2px 8px;
        border-radius: 4px;
        font-family: monospace;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="icon"><i class="fas fa-sign-in-alt"></i></div>
            <h2>Welcome Back</h2>
            <p>Login to your Star Vehicle PRO account</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-submit"><i class="fas fa-sign-in-alt"></i> Login</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('register') }}">Sign Up Free</a></p>
        </div>

        <div class="admin-hint">
            <i class="fas fa-user-shield"></i>
            <strong>Admin Login:</strong> <code>admin@starvehicle.pro</code> / <code>admin123</code>
        </div>
    </div>
</div>
{% endblock %}
