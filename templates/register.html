{% extends "base.html" %}

{% block title %}Sign Up - Star Vehicle PRO{% endblock %}

{% block extra_css %}
<style>
    .auth-page {
        min-height: calc(100vh - 70px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
        background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
    }

    .auth-card {
        background: var(--white);
        border-radius: 24px;
        padding: 3rem 2.5rem;
        width: 100%;
        max-width: 480px;
        box-shadow: 0 25px 80px rgba(0,0,0,0.1);
        border: 1px solid rgba(0,0,0,0.04);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }

    .auth-header .icon {
        width: 70px; height: 70px;
        background: linear-gradient(135deg, var(--accent), #e65100);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 1.8rem;
        color: var(--white);
    }

    .auth-header h2 {
        font-size: 1.8rem;
        color: var(--dark);
        margin-bottom: 0.5rem;
    }

    .auth-header p { color: var(--gray); font-size: 0.95rem; }

    .form-group { margin-bottom: 1.3rem; }

    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: var(--dark);
        font-size: 0.9rem;
    }

    .form-group label i { color: var(--accent); margin-right: 6px; }

    .form-control {
        width: 100%;
        padding: 14px 18px;
        border: 2px solid #e9ecef;
        border-radius: 14px;
        font-size: 1rem;
        font-family: 'Poppins', sans-serif;
        transition: all 0.3s;
        background: #fafbfc;
    }

    .form-control:focus {
        outline: none;
        border-color: var(--accent);
        background: var(--white);
        box-shadow: 0 0 0 4px rgba(255,109,0,0.1);
    }

    .btn-submit {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, var(--accent), #e65100);
        color: var(--white);
        border: none;
        border-radius: 14px;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        font-family: 'Poppins', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 0.5rem;
    }

    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(255,109,0,0.4);
    }

    .auth-footer {
        text-align: center;
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid #e9ecef;
    }

    .auth-footer p { color: var(--gray); font-size: 0.9rem; }

    .auth-footer a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
    }

    .auth-footer a:hover { text-decoration: underline; }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }

    @media (max-width: 480px) {
        .form-row { grid-template-columns: 1fr; }
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="icon"><i class="fas fa-user-plus"></i></div>
            <h2>Create Account</h2>
            <p>Join Star Vehicle PRO for free</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Full Name</label>
                <input type="text" name="full_name" class="form-control" placeholder="John Doe" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Phone</label>
                    <input type="tel" name="phone" class="form-control" placeholder="+1 234 567 890" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
                </div>
            </div>

            <button type="submit" class="btn-submit"><i class="fas fa-rocket"></i> Create Free Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('login') }}">Login Here</a></p>
        </div>
    </div>
</div>
{% endblock %}
